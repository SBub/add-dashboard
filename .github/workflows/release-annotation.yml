name: release-annotation

# A release marker in PostHog (project 302689, EU) for every push to master,
# the production branch: an annotation "adw-dashboard release <short sha>:
# <commit title>" at the push time, so charts show when each release went out.
# Data only, no alerts. See app_docs/analytics.md, "Release markers".

on:
  push:
    branches: [master]

permissions: {}

jobs:
  annotate:
    name: annotate
    runs-on: ubuntu-latest
    steps:
      - name: Create PostHog annotation
        # A marker is nice to have: nothing here may fail the push.
        continue-on-error: true
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$POSTHOG_PERSONAL_API_KEY" ]; then
            echo "::notice::POSTHOG_PERSONAL_API_KEY is not set; skipping the PostHog release annotation."
            exit 0
          fi
          title="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)"
          content="adw-dashboard release ${GITHUB_SHA::7}: ${title}"
          body="$(jq -n --arg content "$content" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{content: $content, date_marker: $date, scope: "project"}')"
          status="$(curl -sS -o "$RUNNER_TEMP/annotation.json" -w '%{http_code}' \
            -X POST "https://eu.posthog.com/api/projects/302689/annotations/" \
            -H "Authorization: Bearer ${POSTHOG_PERSONAL_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "$body")" || status="curl-error"
          if [ "$status" = "201" ] || [ "$status" = "200" ]; then
            echo "Created PostHog annotation: $content"
          else
            echo "::warning::PostHog annotation not created (HTTP $status)."
          fi
